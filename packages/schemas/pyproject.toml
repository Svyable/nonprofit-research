[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-centre-atlas-schemas"
version = "0.1.0"
description = "Executable data contract for Research Centre Atlas jurisdiction packets"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
